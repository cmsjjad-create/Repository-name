<!-- كود CSS للتصميم المطابق -->
<style>
  /* حاوية الشبكة (Grid) */
  .hitv-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 10px;
    background-color: #0b0c0e; /* خلفية داكنة جداً مطابقة للموقع */
    direction: rtl;
  }

  /* بطاقة الفيلم/المسلسل */
  .hitv-card {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  /* حاوية الصورة/البوستر */
  .poster-container {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4; /* أبعاد البوستر القياسية */
    border-radius: 14px; /* زوايا منحنية بالكامل */
    overflow: hidden;
    background-color: #1a1c23;
  }

  .poster-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* شارة التقييم (أسفل يسار الصورة) */
  .rating-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    direction: ltr; /* لضمان ظهور النجمة على اليمين/اليسار بشكل صحيح */
  }

  .rating-badge i {
    color: #ffb400; /* لون النجمة الذهبي/الأصفر */
    font-size: 10px;
  }

  /* معلومات العمل تحت الصورة */
  .card-info {
    padding: 8px 4px 4px 4px;
    text-align: right;
  }

  .card-title {
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    color: #828a99;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<!-- هيكل بطاقات HTML -->
<div class="hitv-grid">

  <!-- العنصر الأول -->
  <div class="hitv-card">
    <div class="poster-container">
      <img src="https://picsum.photos/id/1018/300/400" alt="صائد الساحرات">
      <div class="rating-badge">
        <i class="fas fa-star"></i> 8.8
      </div>
    </div>
    <div class="card-info">
      <div class="card-title">صائد الساحرات</div>
      <div class="card-meta">2021 • أكشن • فانتازيا</div>
    </div>
  </div>

  <!-- العنصر الثاني -->
  <div class="hitv-card">
    <div class="poster-container">
      <img src="https://picsum.photos/id/1015/300/400" alt="دموع من فولاذ">
      <div class="rating-badge">
        <i class="fas fa-star"></i> 9.1
      </div>
    </div>
    <div class="card-info">
      <div class="card-title">دموع من فولاذ</div>
      <div class="card-meta">2022 • خيال علمي • دراما</div>
    </div>
  </div>

</div>
