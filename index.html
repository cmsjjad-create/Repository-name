<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - شبكتي | Cinemana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f141e;
            --card-bg: #181e2a;
            --cinemana-red: #e50914;
            --cinemana-yellow: #ffb400;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #232d3f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* شريط الملاحة الشبيه بسينمانا */
        header {
            background: #131924;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--cinemana-red);
            text-decoration: none;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: #1c2433;
            border: 1px solid var(--border-color);
            padding: 8px 35px 8px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        nav.menu {
            display: flex;
            gap: 15px;
        }

        nav.menu a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        nav.menu a.active, nav.menu a:hover {
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* مشغل الفيديو الشبيه بسينمانا */
        #playerSection {
            display: none;
            margin-bottom: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-bar {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121722;
        }

        .player-title {
            font-weight: bold;
            font-size: 15px;
        }

        .btn-fullscreen {
            background: var(--cinemana-red);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* عنوان الأقسام */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 15px 0;
            border-right: 4px solid var(--cinemana-red);
            padding-right: 10px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* شبكة العرض (Grid) */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        @media (min-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        /* بطاقات الأفلام والمسلسلات */
        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .poster-container {
            width: 100%;
            padding-top: 145%;
            position: relative;
            background: #232d3f;
        }

        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
        }

        .rating {
            color: var(--cinemana-yellow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header>
        <div class="header-container">
            <a href="#" class="brand">
                <i class="fas fa-play-circle"></i> سينمانا
            </a>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="ابحث عن فيلم أو مسلسل...">
            </div>

            <nav class="menu">
                <a href="#" class="active">الرئيسية</a>
                <a href="#">الأفلام</a>
                <a href="#">المسلسلات</a>
            </nav>
        </div>
    </header>

    <div class="container">

        <!-- مشغل الفيديو -->
        <div id="playerSection">
            <div class="video-wrapper" id="videoBox">
                <iframe id="videoIframe" src="" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen></iframe>
            </div>
            <div class="player-bar">
                <span class="player-title" id="playingTitle">اسم الفيلم</span>
                <button class="btn-fullscreen" onclick="goFullscreen()">
                    <i class="fas fa-expand"></i> ملء الشاشة
                </button>
            </div>
        </div>

        <!-- قسم الأحدث -->
        <div class="section-header">
            <h2 class="section-title">أحدث المضاف حديثاً</h2>
        </div>

        <div class="movies-grid">
            
            <!-- فيلم 1 -->
            <div class="movie-card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'سبايدرمان: يوم جديد (2026)')">
                <div class="poster-container">
                    <span class="badge-quality">FHD</span>
                    <img src="https://picsum.photos/id/1018/300/430" alt="سبايدرمان">
                </div>
                <div class="movie-info">
                    <div class="movie-title">سبايدرمان: يوم جديد</div>
                    <div class="movie-meta">
                        <span>2026</span>
                        <span class="rating"><i class="fas fa-star"></i> 7.8</span>
                    </div>
                </div>
            </div>

            <!-- فيلم 2 -->
            <div class="movie-card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'الشر المقيم (2026)')">
                <div class="poster-container">
                    <span class="badge-quality">4K</span>
                    <img src="https://picsum.photos/id/1015/300/430" alt="الشر المقيم">
                </div>
                <div class="movie-info">
                    <div class="movie-title">الشر المقيم</div>
                    <div class="movie-meta">
                        <span>2026</span>
                        <span class="rating"><i class="fas fa-star"></i> 7.3</span>
                    </div>
                </div>
            </div>

            <!-- فيلم 3 -->
            <div class="movie-card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'باتمان: الظلام')">
                <div class="poster-container">
                    <span class="badge-quality">FHD</span>
                    <img src="https://picsum.photos/id/1019/300/430" alt="باتمان">
                </div>
                <div class="movie-info">
                    <div class="movie-title">باتمان: عودة الظلام</div>
                    <div class="movie-meta">
                        <span>2025</span>
                        <span class="rating"><i class="fas fa-star"></i> 8.5</span>
                    </div>
                </div>
            </div>

            <!-- فيلم 4 -->
            <div class="movie-card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'مهمة مستحيلة')">
                <div class="poster-container">
                    <span class="badge-quality">WEB-DL</span>
                    <img src="https://picsum.photos/id/1022/300/430" alt="مهمة مستحيلة">
                </div>
                <div class="movie-info">
                    <div class="movie-title">مهمة مستحيلة</div>
                    <div class="movie-meta">
                        <span>2025</span>
                        <span class="rating"><i class="fas fa-star"></i> 8.1</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function playVideo(url, title) {
            const playerSection = document.getElementById('playerSection');
            const iframe = document.getElementById('videoIframe');
            const titleElement = document.getElementById('playingTitle');
            
            iframe.src = url;
            titleElement.innerText = title;
            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function goFullscreen() {
            const box = document.getElementById('videoBox');
            if (box.requestFullscreen) {
                box.requestFullscreen();
            } else if (box.webkitRequestFullscreen) {
                box.webkitRequestFullscreen();
            } else if (box.msRequestFullscreen) {
                box.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
