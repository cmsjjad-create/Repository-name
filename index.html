<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا | منصة الأفلام والمسلسلات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --accent: #e50914;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        nav {
            background: #121620;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2430;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* حاوية مشغل الفيديو */
        #playerSection {
            display: none;
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151922;
            padding: 12px 20px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .btn-fullscreen {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-right: 4px solid var(--accent);
            padding-right: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .poster-box {
            width: 100%;
            height: 230px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #e2e8f0;
        }

        .poster-box i {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 5px;
        }

        .rating {
            color: #f6e05e;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fas fa-film"></i> سينمانا</div>
    </nav>

    <div class="container">
        <!-- منطقة المشغل -->
        <div id="playerSection">
            <div class="video-wrapper" id="videoBox">
                <iframe id="videoIframe" src="" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen></iframe>
            </div>
            <div class="player-tools">
                <span id="playingTitle">جاري التشغيل...</span>
                <button class="btn-fullscreen" onclick="goFullscreen()"><i class="fas fa-expand"></i> ملء الشاشة</button>
            </div>
        </div>

        <h2 class="section-title">أحدث الأفلام والمسلسلات</h2>
        <div class="grid" id="moviesGrid">
            
            <!-- الفيلم الأول -->
            <div class="card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'سبايدرمان: يوم جديد')">
                <div class="poster-box">
                    <i class="fas fa-mask"></i>
                    <span>سبايدرمان</span>
                </div>
                <div class="card-info">
                    <div class="card-title">سبايدرمان: يوم جديد</div>
                    <div class="card-meta">
                        <span>2026</span>
                        <span class="rating"><i class="fas fa-star"></i> 7.8</span>
                    </div>
                </div>
            </div>

            <!-- الفيلم الثاني -->
            <div class="card" onclick="playVideo('https://www.youtube.com/embed/dQw4w9WgXcQ', 'الشر المقيم')">
                <div class="poster-box">
                    <i class="fas fa-biohazard"></i>
                    <span>الشر المقيم</span>
                </div>
                <div class="card-info">
                    <div class="card-title">الشر المقيم</div>
                    <div class="card-meta">
                        <span>2026</span>
                        <span class="rating"><i class="fas fa-star"></i> 7.3</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function playVideo(url, title) {
            const playerSection = document.getElementById('playerSection');
            const iframe = document.getElementById('videoIframe');
            const titleElement = document.getElementById('playingTitle');
            
            iframe.src = url;
            titleElement.innerText = title;
            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function goFullscreen() {
            const box = document.getElementById('videoBox');
            if (box.requestFullscreen) {
                box.requestFullscreen();
            } else if (box.webkitRequestFullscreen) {
                box.webkitRequestFullscreen();
            } else if (box.msRequestFullscreen) {
                box.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
