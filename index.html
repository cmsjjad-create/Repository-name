<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - Cinemana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --cinemana-red: #e50914;
            --accent-yellow: #ffb400;
            --text-main: #ffffff;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: #121721;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            color: var(--cinemana-red);
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: #1c212c;
            border: 1px solid var(--border-color);
            padding: 9px 38px 9px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* قسم المشغل في أعلى الصفحة */
        #playerSection {
            display: none;
            margin-bottom: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .player-bar {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121721;
            border-bottom: 1px solid var(--border-color);
        }

        .player-title {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 15px 0;
            border-right: 4px solid var(--cinemana-red);
            padding-right: 10px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        @media (min-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .poster-container {
            width: 100%;
            padding-top: 148%;
            position: relative;
            background: #21262d;
        }

        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
        }

        .rating {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 16px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand" onclick="loadMovies()">
                <i class="fas fa-play-circle"></i> سينمانا
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن اسم فيلم..." onkeyup="handleSearch(event)">
            </div>
        </div>
    </header>

    <div class="container">

        <!-- مشغل الفيديو العلوي -->
        <div id="playerSection">
            <div class="player-bar">
                <span class="player-title" id="playingTitle">عنوان الفيلم</span>
            </div>
            <div id="videoContainer">
                <video id="player" playsinline controls></video>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title" id="gridTitle">أحدث الأفلام والمسلسلات</h2>
        </div>

        <div class="movies-grid" id="moviesGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل مكتبة الأفلام...</div>
        </div>

    </div>

    <!-- مكتبة Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        let plyrInstance = null;

        // مصفوفة قائمة الأفلام مع روابط الفيديو المباشرة والأغلفة
        const moviesList = [
            {
                id: 1,
                title: 'صائد الساحرات الأخيرة (Sintel)',
                year: '2021',
                rating: '8.5',
                poster: 'https://upload.wikimedia.org/wikipedia/commons/8/8f/Sintel_poster.jpg',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'
            },
            {
                id: 2,
                title: 'دموع من فولاذ (Tears of Steel)',
                year: '2022',
                rating: '7.9',
                poster: 'https://upload.wikimedia.org/wikipedia/commons/0/0c/Tears_of_Steel_poster.chunk.jpg',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4'
            },
            {
                id: 3,
                title: 'مغامرات الأرنب (Big Buck Bunny)',
                year: '2023',
                rating: '8.1',
                poster: 'https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
            },
            {
                id: 4,
                title: 'رحلة البحث عن النجوم (For Bigger Blazes)',
                year: '2024',
                rating: '8.8',
                poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // تهيئة مشغل Plyr باللغة العربية
            plyrInstance = new Plyr('#player', {
                i18n: {
                    play: 'تشغيل',
                    pause: 'إيقاف مؤقت',
                    restart: 'إعادة',
                    rewind: 'ترجيع',
                    forward: 'تقديم',
                    captions: 'الترجمة',
                    settings: 'الإعدادات',
                    speed: 'السرعة',
                    quality: 'الجودة',
                    fullscreen: 'ملء الشاشة'
                }
            });

            loadMovies();
        });

        function loadMovies(filteredList = null) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            const listToDisplay = filteredList || moviesList;

            if (listToDisplay.length === 0) {
                grid.innerHTML = '<div class="loading">لم يتم العثور على أية نتائج.</div>';
                return;
            }

            listToDisplay.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.videoUrl, movie.title, movie.poster);

                card.innerHTML = `
                    <div class="poster-container">
                        <span class="badge-quality">FHD</span>
                        <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fas fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تشغيل الفيلم وتحديث المشغل بالأعلى
        function playMovie(videoUrl, title, posterUrl) {
            const playerSection = document.getElementById('playerSection');
            const titleElement = document.getElementById('playingTitle');

            titleElement.innerText = title;

            plyrInstance.source = {
                type: 'video',
                title: title,
                sources: [
                    {
                        src: videoUrl,
                        type: 'video/mp4'
                    }
                ],
                poster: posterUrl
            };

            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
            plyrInstance.play();
        }

        // البحث الفوري بالأفلام
        function handleSearch(e) {
            const query = e.target.value.trim().toLowerCase();
            const gridTitle = document.getElementById('gridTitle');

            if (query === '') {
                gridTitle.innerText = 'أحدث الأفلام والمسلسلات';
                loadMovies();
                return;
            }

            gridTitle.innerText = `نتائج البحث عن: ${query}`;
            const results = moviesList.filter(movie => movie.title.toLowerCase().includes(query));
            loadMovies(results);
        }
    </script>
</body>
</html>
