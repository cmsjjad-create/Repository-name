<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - Cinemana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* هيدر شريط الملاحة */
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* حاوية مشغل الفيديو */
        .player-container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 10px;
            flex: 1;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة العرض إلى الارتفاع 16:9 */
            height: 0;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        /* أزرار التحكم السريعة */
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
        }

        .btn-fullscreen {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-fullscreen:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 سينمانا</div>
    </header>

    <div class="player-container">
        <div class="iframe-wrapper" id="videoWrapper">
            <!-- خاصية sandbox تمنع فتح النوافذ المنبثقة والإعلانات والتوجيه المزعج -->
            <iframe 
                id="mainPlayer"
                src="ضع_رابط_سيرفر_الفيديو_هنا" 
                title="مشغل سينمانا"
                sandbox="allow-scripts allow-same-origin allow-forms"
                allow="fullscreen; autoplay; picture-in-picture"
                allowfullscreen="true"
                webkitallowfullscreen="true"
                mozallowfullscreen="true">
            </iframe>
        </div>

        <div class="controls">
            <span>عرض الفيديو</span>
            <button class="btn-fullscreen" onclick="openFullscreen()">🖥️ ملء الشاشة</button>
        </div>
    </div>

    <script>
        // دالة تفعيل ملء الشاشة بضغطة زر للجوال والكمبيوتر
        function openFullscreen() {
            const elem = document.getElementById("videoWrapper");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // حماية إضافية لمنع السكربتات الخبيثة والإعلانات من فتح صفحات جديدة
        window.onbeforeunload = function() {
            // يمنع التوجيه التلقائي المزعج
        };
    </script>
</body>
</html>
