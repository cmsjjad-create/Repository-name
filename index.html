<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - Cinemana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --cinemana-red: #e50914;
            --accent-yellow: #ffb400;
            --text-main: #ffffff;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: #121721;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            color: var(--cinemana-red);
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            max-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: #1c212c;
            border: 1px solid var(--border-color);
            padding: 8px 35px 8px 12px;
            border-radius: 20px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .container {
            max-width: 1000px;
            margin: 15px auto;
            padding: 0 12px;
        }

        /* قسم المشغل والتفاصيل */
        #playerSection {
            display: none;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .movie-details-box {
            padding: 15px;
            background: #121721;
            border-top: 1px solid var(--border-color);
        }

        .details-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }

        .details-meta {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
        }

        .details-overview {
            font-size: 13px;
            color: #c9d1d9;
            line-height: 1.5;
        }

        .section-header {
            margin: 15px 0 10px 0;
            border-right: 3px solid var(--cinemana-red);
            padding-right: 8px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
        }

        /* شبكة الكروت بحجم صغير ومحدد لـ 4 أفلام */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .movie-card:active {
            transform: scale(0.97);
        }

        .poster-container {
            width: 100%;
            padding-top: 135%; /* نسبة ارتفاع أصغر للبوستر */
            position: relative;
            background: #21262d;
        }

        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-quality {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-sub);
        }

        .rating {
            color: var(--accent-yellow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand" onclick="loadMovies()">
                <i class="fas fa-play-circle"></i> سينمانا
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث..." onkeyup="handleSearch(event)">
            </div>
        </div>
    </header>

    <div class="container">

        <!-- مشغل الفيديو وقسم التفاصيل -->
        <div id="playerSection">
            <div id="videoContainer">
                <video id="player" playsinline controls></video>
            </div>
            <div class="movie-details-box">
                <div class="details-title" id="detailTitle">عنوان الفيلم</div>
                <div class="details-meta">
                    <span id="detailYear"><i class="fas fa-calendar-alt"></i> 2024</span>
                    <span id="detailRating" style="color: var(--accent-yellow);"><i class="fas fa-star"></i> 8.5</span>
                </div>
                <div class="details-overview" id="detailOverview">قصة الفيلم وتفاصيله المكتوبة تظهر هنا...</div>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title" id="gridTitle">الأفلام المتاحة (4)</h2>
        </div>

        <div class="movies-grid" id="moviesGrid"></div>

    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        let plyrInstance = null;

        // قائمة من 4 أفلام فقط مع غلاف صغير وتفاصيل وروابط فيديو
        const moviesList = [
            {
                id: 1,
                title: 'صائد الساحرات',
                year: '2021',
                rating: '8.5',
                overview: 'فيلم مغامرة وفانتازيا يخوض فيه البطل رحلة محفوفة بالمخاطر عبر العوالم الأسطورية.',
                poster: 'https://picsum.photos/id/1018/300/400',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'
            },
            {
                id: 2,
                title: 'دموع من فولاذ',
                year: '2022',
                rating: '7.9',
                overview: 'فيلم خيال علمي يدور في المستقبل حول مجموعة من المستكشفين لمحاولة إنقاذ كوكب الأرض.',
                poster: 'https://picsum.photos/id/1015/300/400',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4'
            },
            {
                id: 3,
                title: 'مغامرة الأرنب',
                year: '2023',
                rating: '8.1',
                overview: 'فيلم أنيميشن كوميدي عائلي يحكي عن أرنب ضخم يواجه كائنات الغابة الشقية.',
                poster: 'https://picsum.photos/id/1025/300/400',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
            },
            {
                id: 4,
                title: 'البحث عن النجوم',
                year: '2024',
                rating: '8.8',
                overview: 'رحلة استكشافية مشوقة في أعماق الفضاء للكشف عن أسرار المجرات البعيدة.',
                poster: 'https://picsum.photos/id/1039/300/400',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            plyrInstance = new Plyr('#player', {
                i18n: {
                    play: 'تشغيل',
                    pause: 'إيقاف',
                    fullscreen: 'ملء الشاشة'
                }
            });

            loadMovies();
        });

        function loadMovies(filteredList = null) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            const listToDisplay = filteredList || moviesList;

            listToDisplay.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openMovie(movie);

                card.innerHTML = `
                    <div class="poster-container">
                        <span class="badge-quality">FHD</span>
                        <img src="${movie.poster}" alt="${movie.title}">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fas fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // عند الضغط على الكارت: عرض التفاصيل + تشغيل الفيديو بالمشغل الأعلى
        function openMovie(movie) {
            const playerSection = document.getElementById('playerSection');

            // تعبئة بيانات التفاصيل
            document.getElementById('detailTitle').innerText = movie.title;
            document.getElementById('detailYear').innerHTML = `<i class="fas fa-calendar-alt"></i> ${movie.year}`;
            document.getElementById('detailRating').innerHTML = `<i class="fas fa-star"></i> ${movie.rating}`;
            document.getElementById('detailOverview').innerText = movie.overview;

            // تحديث مصدر مشغل Plyr
            plyrInstance.source = {
                type: 'video',
                title: movie.title,
                sources: [{ src: movie.videoUrl, type: 'video/mp4' }],
                poster: movie.poster
            };

            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
            plyrInstance.play();
        }

        function handleSearch(e) {
            const query = e.target.value.trim().toLowerCase();
            if (query === '') {
                loadMovies();
                return;
            }
            const results = moviesList.filter(movie => movie.title.toLowerCase().includes(query));
            loadMovies(results);
        }
    </script>
</body>
</html>
