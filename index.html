<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - Cinemana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --cinemana-red: #e50914;
            --accent-yellow: #ffb400;
            --text-main: #ffffff;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: #121721;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            color: var(--cinemana-red);
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: #1c212c;
            border: 1px solid var(--border-color);
            padding: 9px 38px 9px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* المشغل في الأعلى */
        #playerSection {
            display: none;
            margin-bottom: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .player-bar {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121721;
        }

        .player-title {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 15px 0;
            border-right: 4px solid var(--cinemana-red);
            padding-right: 10px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        @media (min-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .poster-container {
            width: 100%;
            padding-top: 148%;
            position: relative;
            background: #21262d;
        }

        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
        }

        .rating {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 16px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand" onclick="loadTrendingMovies()">
                <i class="fas fa-play-circle"></i> سينمانا
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن اسم فيلم..." onkeyup="handleSearch(event)">
            </div>
        </div>
    </header>

    <div class="container">

        <!-- مشغل Plyr في أصل الصفحة -->
        <div id="playerSection">
            <div class="player-bar">
                <span class="player-title" id="playingTitle">عنوان الفيلم</span>
            </div>
            <div id="mediaContainer">
                <video id="player" playsinline controls>
                    <source id="videoSource" src="" type="video/mp4" />
                </video>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title" id="gridTitle">أحدث الأفلام والمسلسلات</h2>
        </div>

        <div class="movies-grid" id="moviesGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأفلام...</div>
        </div>

    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        const API_KEY = 'e2b3e8e19e1208947d6e6f4a8cb87c2a';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
        let plyrInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            // تهيئة مكتبة Plyr باللغة العربية
            plyrInstance = new Plyr('#player', {
                i18n: {
                    play: 'تشغيل',
                    pause: 'إيقاف مؤقت',
                    restart: 'إعادة',
                    rewind: 'ترجيع',
                    forward: 'تقديم',
                    captions: 'الترجمة',
                    settings: 'الإعدادات',
                    speed: 'السرعة',
                    quality: 'الجودة',
                    fullscreen: 'ملء الشاشة'
                }
            });

            loadTrendingMovies();
        });

        async function loadTrendingMovies() {
            document.getElementById('gridTitle').innerText = 'أحدث الأفلام والمسلسلات';
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأفلام...</div>';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                grid.innerHTML = '<div class="loading">حدث خطأ أثناء تحميل البيانات.</div>';
            }
        }

        function displayMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if(!movies || movies.length === 0) {
                grid.innerHTML = '<div class="loading">لم يتم العثور على أية نتائج.</div>';
                return;
            }

            movies.forEach(movie => {
                const title = movie.title || movie.name || 'بدون عنوان';
                const releaseDate = (movie.release_date || movie.first_air_date || '').split('-')[0] || 'N/A';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '7.0';
                const poster = movie.poster_path ? (IMG_PATH + movie.poster_path) : 'https://via.placeholder.com/300x450/161b22/ffffff?text=بدون+صورة';

                const card = document.createElement('div');
                card.className = 'movie-card';
                // فيديو افتراضي للتحقق من تشغيل Plyr بنجاح
                const sampleVideo = 'https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-576p.mp4';
                card.onclick = () => playMovie(sampleVideo, title, poster);

                card.innerHTML = `
                    <div class="poster-container">
                        <span class="badge-quality">FHD</span>
                        <img src="${poster}" alt="${title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>${releaseDate}</span>
                            <span class="rating"><i class="fas fa-star"></i> ${rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تشغيل الفيلم وتحديد الغلاف والعنوان أعلى الصفحة
        function playMovie(videoUrl, title, posterUrl) {
            const playerSection = document.getElementById('playerSection');
            const titleElement = document.getElementById('playingTitle');

            titleElement.innerText = title;
            
            // تحديث مصدر الفيديو والغلاف في Plyr
            plyrInstance.source = {
                type: 'video',
                title: title,
                sources: [
                    {
                        src: videoUrl,
                        type: 'video/mp4',
                    },
                ],
                poster: posterUrl
            };

            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth' });
            plyrInstance.play();
        }

        let searchTimeout;
        function handleSearch(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 2) {
                if(query.length === 0) loadTrendingMovies();
                return;
            }

            searchTimeout = setTimeout(async () => {
                document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
                const grid = document.getElementById('moviesGrid');
                grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري البحث...</div>';

                try {
                    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    displayMovies(data.results);
                } catch (err) {
                    grid.innerHTML = '<div class="loading">حدث خطأ أثناء البحث.</div>';
                }
            }, 500);
        }
    </script>
</body>
</html>
